version: '3.8'

name: ggs_dev

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: ggs_redis
    restart: unless-stopped
    ports:
      - "${GGS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ggs_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  # MongoDB服务
  mongodb:
    image: mongo:8
    container_name: ggs_mongodb
    restart: unless-stopped
    ports:
      - "${GGS_MONGODB_PORT:-27017}:27017"
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: admin
    #   MONGO_INITDB_ROOT_PASSWORD: admin123
    #   MONGO_INITDB_DATABASE: ggs_dev
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ggs_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s
    command: ["mongod", "--bind_ip_all"]

  # Etcd服务（单节点，开发用）
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: ggs_etcd
    restart: unless-stopped
    ports:
      - "${GGS_ETCD_CLIENT_PORT:-2379}:2379"  # 客户端端口
      - "${GGS_ETCD_PEER_PORT:-2380}:2380"  # peer端口
    environment:
      - ETCDCTL_API=3
      - ETCD_ENABLE_V2=false
      - ETCD_NAME=etcd
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_DATA_DIR=/var/lib/etcd
    volumes:
      - etcd_data:/var/lib/etcd
    networks:
      - ggs_network
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # 登录服务
  login:
    image: ${GGS_IMAGE_PREFIX:-ggs}/login:${GGS_IMAGE_TAG:-dev}
    container_name: ggs_login
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "${GGS_LOGIN_PORT:-8080}:8080"
    volumes:
      - ./configs/login.toml:/app/configs/config.toml:rw
    networks:
      - ggs_network

  # 平台服务
  platform:
    image: ${GGS_IMAGE_PREFIX:-ggs}/platform:${GGS_IMAGE_TAG:-dev}
    container_name: ggs_platform
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: ["-env-server-id", "${GGS_GAME_SERVER_ID:-1}"]
    ports:
      - "${GGS_PLATFORM_PORT:-8081}:8080"
      - "${GGS_PLATFORM_CLUSTER_PORT:-23002}:20002"
    volumes:
      - ./configs/platform.toml:/app/configs/config.toml:rw
    networks:
      - ggs_network

  # 游戏服务
  game:
    image: ${GGS_IMAGE_PREFIX:-ggs}/game:${GGS_IMAGE_TAG:-dev}
    container_name: ggs_game
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      etcd:
        condition: service_healthy
    command: ["-env-server-id", "${GGS_GAME_SERVER_ID:-1}", "-env-gdconf-db", "${GGS_GDCONF_DB:-gdconf_dev}"]
    ports:
      - "${GGS_GAME_CLUSTER_PORT:-22002}:20002"
      - "${GGS_GAME_MONITOR_PORT:-22088}:8888"
    volumes:
      - ./configs/game.toml:/app/configs/config.toml:rw
    networks:
      - ggs_network

  # 网关服务
  agent:
    image: ${GGS_IMAGE_PREFIX:-ggs}/agent:${GGS_IMAGE_TAG:-dev}
    container_name: ggs_agent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    command: ["-env-server-id", "${GGS_AGENT_SERVER_ID:-1}"]
    ports:
      - "${GGS_AGENT_PORT:-21001}:20001"
      - "${GGS_AGENT_CLUSTER_PORT:-21002}:20002"
      - "${GGS_AGENT_MONITOR_PORT:-21088}:8888"
    volumes:
      - ./configs/agent.toml:/app/configs/config.toml:rw
    networks:
      - ggs_network

# 数据卷
volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  etcd_data:
    driver: local

# 网络
networks:
  ggs_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.2.0/24
